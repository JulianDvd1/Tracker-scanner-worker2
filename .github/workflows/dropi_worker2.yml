name: Dropi Worker Node 2 (Cloud Shards 4-7)

on:
  schedule:
    # Corre cada 2 horas en el minuto 00 (15 min antes del Consolidador Principal)
    - cron: '0 1-23/2 * * *'
  workflow_dispatch:
    inputs:
      pages:
        description: 'Cantidad de páginas a escanear (1730 = Catálogo Completo)'
        required: true
        default: '1730'

concurrency:
  group: dropi-worker2-scanner
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  scan_shards:
    name: Shard ${{ matrix.shard }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 4
            os: ubuntu-24.04
            token_index: 1
          - shard: 5
            os: windows-latest
            token_index: 2
          - shard: 6
            os: macos-latest
            token_index: 3
          - shard: 7
            os: macos-15
            token_index: 4
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Ejecutar Shard en Modo Directo
        env:
          DROPI_TOKEN_1: ${{ secrets.DROPI_TOKEN_1 }}
          DROPI_TOKEN_2: ${{ secrets.DROPI_TOKEN_2 }}
          DROPI_TOKEN_3: ${{ secrets.DROPI_TOKEN_3 }}
          DROPI_TOKEN_4: ${{ secrets.DROPI_TOKEN_4 }}
          DROPI_TOKEN: ${{ secrets.DROPI_TOKEN_1 || secrets.DROPI_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          python cloud_worker.py --shard-id ${{ matrix.shard }} --total-shards 8 --pages ${{ github.event.inputs.pages || '1730' }} --token-index ${{ matrix.token_index }} --db-name catalog_shard_${{ matrix.shard }}.db

      - name: Subir Base de Datos del Shard
        uses: actions/upload-artifact@v4
        with:
          name: catalog_shard_${{ matrix.shard }}
          path: catalog_shard_${{ matrix.shard }}.db
          if-no-files-found: error

  empaquetar_y_publicar:
    name: Empaquetar Shards del Nodo 2 y Publicar Asset
    needs: scan_shards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Descargar Shards del Nodo 2
        uses: actions/download-artifact@v4
        with:
          pattern: catalog_shard_*
          path: downloaded_shards

      - name: Crear Zip de Shards
        run: |
          mkdir -p package
          cd downloaded_shards
          zip -r ../package/worker2-shards.zip .
          cd ..

      - name: Publicar Release de Shards para el Nodo Principal
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0-worker2"
          name: "Shards 4-7 Dropi Worker Node 2"
          body: "Artefactos consolidados de Shards 4, 5, 6 y 7 listos para integración por Tracker-scanner."
          files: package/worker2-shards.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
